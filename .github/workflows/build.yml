name: Build Firmware v2

on:
  push:
    paths:
      - 'firmware_v2.ino'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Instalar core do ESP32
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Preparar pasta do sketch
        run: |
          mkdir -p firmware_v2/firmware_v2
          cp firmware_v2.ino firmware_v2/firmware_v2/firmware_v2.ino

      - name: Compilar
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 firmware_v2/firmware_v2 --output-dir build

      - name: Renomear para firmware_v2.bin
        run: |
          cp build/firmware_v2.ino.bin firmware_v2.bin

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: firmware_v2
          path: firmware_v2.bin
